name: tripsync
description: "AI-powered business travel planning platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.8.4

  # Auth
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1

  # Google APIs
  google_maps_flutter: ^2.12.0
  google_places_flutter: ^2.0.3
  googleapis: ^13.2.0
  google_sign_in: ^6.2.2
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # AI
  google_generative_ai: ^0.4.6

  # Storage
  hive_flutter: ^1.1.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Utilities
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  generate: true
